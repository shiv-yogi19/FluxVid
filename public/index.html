<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<meta name="description" content="FluxVid downloads video and audio from supported public sources.">
<title>FluxVid - Download videos and audio</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="style.css">
<noscript><style>#intro{display:none}.app{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-glow"></div>
  <div class="stage s1">
    <p class="wordmark"><span style="--i:0">F</span><span style="--i:1">L</span><span style="--i:2">U</span><span style="--i:3">X</span><span style="--i:4">V</span><span style="--i:5">I</span><span style="--i:6">D</span></p>
  </div>
  <div class="stage s2">
    <p class="by">Created By</p>
    <p class="creator">Shiv Yogi</p>
    <span class="rule"></span>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="./"><img src="assets/logo.svg" alt="" width="30" height="30"><span>FluxVid</span></a>
    <button class="icon-btn" id="historyBtn" type="button" aria-label="Download history" aria-expanded="false" aria-controls="history">
      <span class="ico" data-icon="history"></span>
    </button>
  </header>

  <main class="main">
    <section class="hero">
      <h1>FluxVid</h1>
      <p>Download videos and audio<br>from supported sources.</p>
    </section>

    <form class="glass url-card" id="urlForm" novalidate>
      <label class="field" id="field">
        <span class="ico" data-icon="link"></span>
        <input id="urlInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste video or audio URL..." aria-label="Video or audio URL" aria-describedby="urlHint">
      </label>
      <p class="hint" id="urlHint" role="status"></p>
      <div class="actions">
        <button class="btn ghost" id="pasteBtn" type="button"><span class="ico" data-icon="paste"></span><span class="lbl">Paste</span></button>
        <button class="btn primary" id="analyzeBtn" type="submit"><span class="ico" data-icon="search"></span><span class="lbl">Analyze</span></button>
      </div>
    </form>
    <p class="notice"><span class="ico" data-icon="info"></span><span>Public links only. Private, DRM-protected or restricted sources are not supported.</span></p>

    <section id="stage" class="stage-area" aria-live="polite"></section>
  </main>

  <footer class="footer">Created by Shiv Yogi</footer>

  <aside class="sheet glass" id="history" hidden aria-label="Download history">
    <div class="sheet-head">
      <h2>History</h2>
      <button class="btn mini" id="clearHistory" type="button">Clear</button>
      <button class="icon-btn" id="closeHistory" type="button" aria-label="Close history"><span class="ico" data-icon="close"></span></button>
    </div>
    <p class="empty" id="historyEmpty">Your downloads will appear here. History stays on this device.</p>
    <ul class="history-list" id="historyList"></ul>
  </aside>
</div>

<template id="tpl-loading">
  <div class="glass card state" role="status">
    <span class="ico spin" data-icon="spinner"></span>
    <div><strong>Analyzing media</strong><p>Reading details from the source.</p></div>
  </div>
</template>

<template id="tpl-error">
  <div class="glass card state error" role="alert">
    <span class="ico" data-icon="error"></span>
    <div>
      <strong data-slot="title">Unable to process this URL</strong>
      <p data-slot="text"></p>
      <button class="btn ghost" type="button" data-slot="retry"><span class="ico" data-icon="search"></span><span class="lbl">Try again</span></button>
    </div>
  </div>
</template>

<template id="tpl-media">
  <article class="glass card media">
    <div class="media-top">
      <a class="thumb" data-slot="thumb" target="_blank" rel="noopener noreferrer" aria-label="Open original source"><span class="ico play" data-icon="play"></span></a>
      <div class="media-meta">
        <p class="found"><span class="ico" data-icon="video" data-slot="foundIcon"></span><span data-slot="found">Video found</span></p>
        <h2 class="title" data-slot="title"></h2>
        <ul class="chips">
          <li data-slot="durationChip"><span class="ico" data-icon="clock"></span><span data-slot="duration"></span></li>
          <li data-slot="platformChip"><span class="ico" data-icon="link"></span><span data-slot="platform"></span></li>
          <li><span class="ico" data-icon="quality"></span><span data-slot="best"></span></li>
        </ul>
      </div>
    </div>

    <div class="seg" id="seg" role="radiogroup" aria-label="Media type" data-value="video">
      <span class="seg-ind" aria-hidden="true"></span>
      <button type="button" role="radio" data-type="video" aria-checked="true"><span class="ico" data-icon="video"></span><span>Video</span></button>
      <button type="button" role="radio" data-type="audio" aria-checked="false"><span class="ico" data-icon="audio"></span><span>Audio</span></button>
    </div>

    <p class="label" id="qualityLabel">Quality</p>
    <div class="qualities" id="qualities" role="radiogroup" aria-labelledby="qualityLabel"></div>
    <p class="output" data-slot="output"></p>

    <button class="btn primary big" id="downloadBtn" type="button" data-state="idle">
      <span class="ico" data-slot="dlIcon" data-icon="download"></span><span class="lbl" data-slot="dlLabel">Download</span>
    </button>
    <div class="progress" id="progress" hidden><i></i></div>
    <button class="btn ghost cancel" id="cancelBtn" type="button" hidden><span class="ico" data-icon="close"></span><span class="lbl">Cancel</span></button>
    <p class="inline-error" id="dlError" role="alert" hidden></p>

    <div class="done" id="done" hidden role="status">
      <span class="ico draw" data-icon="check"></span>
      <div><strong>Download complete</strong><p data-slot="doneName"></p></div>
    </div>

    <button class="btn ghost back" id="backBtn" type="button"><span class="ico" data-icon="back"></span><span class="lbl">Analyze another link</span></button>
  </article>
</template>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
